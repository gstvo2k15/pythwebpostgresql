apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    version: 1
  - name: Blackbox
    type: prometheus
    access: proxy
    url: http://blackbox_exporter:9115
    version: 1
    editable: true