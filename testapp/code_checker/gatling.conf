gatling {
  core {
    # Output directory
    outputDirectoryBaseName = "gatling"
    outputDirectoryBaseName = ${?GATLING_OUTPUT_DIRECTORY_BASE_NAME}
    
    # Encoding of the files
    encoding = "utf-8"
    
    # Locale
    locale = "en-US"
    
    # Simulation
    simulation {
      # Directory
      directory {
        simulations = "user-files/simulations"
        resources = "user-files/resources"
        binaries = None
      }
    }
    
    # Directory for request bodies
    directory {
      bodies = "user-files/request-bodies"
    }
    
    # Disable the redirecting of the standard output to the log
    redirectStdout = false
    
    # Directory for the generated reports
    reportsOnly = ${?GATLING_REPORTS_ONLY}
    noReports = ${?GATLING_NO_REPORTS}
    
    # Mute the warnings about the usage of non recommended configuration
    mute = ${?GATLING_MUTE}
  }
  
  # Configuration of the HTTP protocol
  http {
    # Warmup
    perUserName = "gatling-user"
  }
  
  # Configuration of the reports
  charting {
    # Max number of standard deviations to display on the charts
    maxStandardDeviation = 2
    
    # Lower bound of the percentage of requests to consider when computing statistics
    lowerBound = 0
    
    # Upper bound of the percentage of requests to consider when computing statistics
    upperBound = 100
  }
  
  # Configuration of the data writers
  data {
    writers = [console, file, graphite]
    
    # Graphite data writer
    graphite {
      # Graphite host
      host = "localhost"
      
      # Graphite port
      port = 2003
      
      # Graphite protocol
      protocol = "tcp"
      
      # Graphite root path prefix
      rootPathPrefix = "gatling"
      
      # Metric prefix
      metricPrefix = ""
      
      # Max size of the buffer
      bufferSize = 8192
    }
  }
  
  # Configuration of the reports
  reports {
    # Enable the generation of reports
    enabled = true
    
    # Directory for the generated reports
    directory = "target/gatling"
  }
}

